<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Katalog pracowników PŚk</title>
  <style>
    :root {
      --bg: #111214;
      --surface: #1b1d21;
      --surface-raised: #22252a;
      --text: #f1f2f4;
      --muted: #a1a6af;
      --border: #343840;
      --accent: #c92130;
      --accent-hover: #e33443;
      --radius: 12px;
      --shadow: 0 3px 12px rgb(0 0 0 / 18%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 20px 42px;
      color: var(--text); background: var(--bg);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: min(1200px, 100%); margin: auto; }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; margin-bottom: 20px; padding: 24px;
      background: linear-gradient(120deg, #24262b, #191a1e);
      border: 1px solid var(--border); border-left: 5px solid var(--accent);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .eyebrow { margin: 0 0 5px; color: #f08a93; font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(23px, 3vw, 31px); line-height: 1.2; }
    .subtitle { margin: 8px 0 0; color: var(--muted); }
    .search-panel {
      padding: 18px; margin-bottom: 18px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .search-label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; }
    .search-row { display: flex; gap: 10px; }
    input[type="search"] {
      width: 100%; min-width: 0; padding: 12px 14px;
      color: var(--text); background: #121316; border: 1px solid #454952;
      border-radius: 8px; font: inherit; outline: none;
    }
    input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(201 33 48 / 20%); }
    button {
      font: inherit; cursor: pointer; border-radius: 8px;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .clear-button { flex: 0 0 auto; padding: 10px 16px; color: var(--text); background: var(--surface-raised); border: 1px solid var(--border); }
    .clear-button:hover { background: #30333a; }
    .results-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 12px; }
    .count { color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
    .card {
      min-width: 0; padding: 18px; background: var(--surface);
      border: 1px solid var(--border); border-top: 3px solid var(--faculty-color, var(--accent));
      border-radius: var(--radius); box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgb(0 0 0 / 25%); }
    .card h2 { margin: 0 0 10px; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .badge { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .faculty-badge { color: var(--faculty-text, #fff); background: var(--faculty-color, #555); }
    .unit-badge { color: #e2e4e8; background: #30333a; border: 1px solid #41454e; }
    .function-badge { color: #ffd9a0; background: #4a351c; border: 1px solid #725126; }
    .details { display: grid; gap: 9px; margin: 0; }
    .detail { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 9px; font-size: 14px; }
    .detail dt { color: var(--muted); }
    .detail dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    .detail a, .copy-email { color: #ff929b; text-decoration: none; }
    .detail a:hover, .copy-email:hover { text-decoration: underline; }
    .copy-email { padding: 0; border: 0; background: transparent; font: inherit; text-align: left; overflow-wrap: anywhere; }
    .copy-email:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    .empty-state { grid-column: 1 / -1; padding: 34px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed #454952; border-radius: var(--radius); }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--text); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 5; padding: 11px 16px; color: #fff; background: #292c32; border: 1px solid #4a4e57; border-radius: 9px; box-shadow: var(--shadow); }
    .toast[hidden] { display: none; }
    @media (max-width: 600px) {
      body { padding: 14px 12px 28px; }
      .page-header { padding: 19px; }
      .search-panel { padding: 14px; }
      .search-row { flex-direction: column; }
      .clear-button { width: 100%; }
      .grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div>
        <p class="eyebrow">Politechnika Świętokrzyska</p>
        <h1>Katalog pracowników</h1>
        <p class="subtitle">Wyszukiwarka pracowników i jednostek organizacyjnych</p>
      </div>
    </header>

    <section class="search-panel" aria-label="Wyszukiwanie pracowników">
      <label class="search-label" for="search">Szukaj pracownika</label>
      <div class="search-row">
        <input type="search" id="search" placeholder="Nazwisko, imię, wydział, katedra, pokój…" autocomplete="off" aria-describedby="count">
        <button class="clear-button" id="clear" type="button">Wyczyść</button>
      </div>
    </section>

    <div class="results-bar"><div class="count" id="count" role="status" aria-live="polite">Ładowanie bazy…</div></div>
    <section class="grid" id="results" aria-label="Wyniki wyszukiwania"></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const searchInput = document.getElementById('search');
    const resultsContainer = document.getElementById('results');
    const countLabel = document.getElementById('count');
    const clearButton = document.getElementById('clear');
    const toast = document.getElementById('toast');

    let employees = [];
    let faculties = [];
    let functionNames = {};
    let toastTimer;

    function normalize(value) {
      return String(value ?? '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')
        .toLocaleLowerCase('pl').trim();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function getFaculty(emp) {
      const parent = String(emp['Jednostka nadrzędna'] || '').trim();
      return faculties.find(f => normalize(f.name) === normalize(parent))
        || faculties.find(f => normalize(parent).includes(normalize(f.name)) || normalize(f.name).includes(normalize(parent)))
        || null;
    }



    function detail(label, value, href = '') {
      if (!value) return '';
      const content = href
        ? `<a href="${escapeHtml(href)}">${escapeHtml(value)}</a>`
        : `<strong>${escapeHtml(value)}</strong>`;
      return `<div class="detail"><dt>${escapeHtml(label)}</dt><dd>${content}</dd></div>`;
    }

    function emailDetail(value) {
      if (!value) return '';
      const email = String(value).includes('@') ? String(value) : `${value}@tu.kielce.pl`;
      return `<div class="detail"><dt>E-mail</dt><dd><button class="copy-email" type="button" data-copy="${escapeHtml(email)}" title="Kliknij, aby skopiować adres">${escapeHtml(email)} ⧉</button></dd></div>`;
    }

    function render(list) {
      countLabel.textContent = `Znaleziono: ${list.length} ${list.length === 1 ? 'pracownika' : 'pracowników'}`;
      if (!list.length) {
        resultsContainer.innerHTML = `<div class="empty-state"><strong>Nie znaleziono pracowników</strong>Spróbuj zmienić wyszukiwaną frazę.</div>`;
        return;
      }

      resultsContainer.innerHTML = list.map(emp => {
        const title = [emp['Tytuł naukowy'], emp['Imię'], emp['Nazwisko']].filter(Boolean).join(' ');
        const unit = emp['Jednostka organizacyjna'] || '';
        const facultyName = emp['Jednostka nadrzędna'] || '';
        const faculty = getFaculty(emp);
        const color = faculty?.color || '#555b66';
        const textColor = faculty?.textColor || '#ffffff';
        const phone = emp['Telefon'];
        const phoneHref = phone ? `tel:${String(phone).replace(/[^+\\d]/g, '')}` : '';

        return `<article class="card" style="--faculty-color:${escapeHtml(color)};--faculty-text:${escapeHtml(textColor)}">
          <h2>${escapeHtml(title || 'Nie podano nazwiska')}</h2>
          <div class="badges">
            ${facultyName ? `<span class="badge faculty-badge" title="${escapeHtml(facultyName)}">${escapeHtml(faculty?.shortName || facultyName)}</span>` : ''}
            ${unit ? `<span class="badge unit-badge">${escapeHtml(unit)}</span>` : ''}
        
          </div>
          <dl class="details">
            ${detail('Budynek', emp['Budynek'])}
            ${detail('Pokój', emp['Pokój'])}
            ${phone ? detail('Telefon', phone, phoneHref) : ''}
            ${emailDetail(emp['Email'])}
            ${emp['Stanowisko'] ? detail('Stanowisko', emp['Stanowisko']) : ''}
          </dl>
        </article>`;
      }).join('');
    }

    function filterEmployees() {
      const query = normalize(searchInput.value);
      render(employees.filter(emp =>
        Object.values(emp).some(value => normalize(value).includes(query))
      ));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
        showToast(`Skopiowano: ${value}`);
      } catch {
        const field = document.createElement('textarea');
        field.value = value;
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand('copy');
        field.remove();
        showToast(copied ? `Skopiowano: ${value}` : 'Nie udało się skopiować adresu.');
      }
    }

    resultsContainer.addEventListener('click', event => {
      const button = event.target.closest('[data-copy]');
      if (button) copyText(button.dataset.copy);
    });

    Promise.all([
      fetch('pracownicy.json').then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch('wydzialy.json').then(r => r.ok ? r.json() : []).catch(() => [])
    ]).then(([employeeData, facultyData, functionData]) => {
      if (!Array.isArray(employeeData)) throw new Error('Nieprawidłowy format bazy pracowników.');
      employees = employeeData;
      faculties = Array.isArray(facultyData) ? facultyData : [];
      functionNames = functionData && typeof functionData === 'object' ? functionData : {};
      render(employees);
    }).catch(() => {
      countLabel.textContent = 'Nie udało się wczytać bazy pracowników.';
      resultsContainer.innerHTML = `<div class="empty-state"><strong>Problem z wczytaniem danych</strong>Sprawdź, czy plik pracownicy.json znajduje się obok pliku index.html.</div>`;
    });

    searchInput.addEventListener('input', filterEmployees);
    clearButton.addEventListener('click', () => {
      searchInput.value = '';
      filterEmployees();
      searchInput.focus();
    });
  </script>
</body>
</html>
